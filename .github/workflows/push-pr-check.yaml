name: Node.js TypeScript GraphQL CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: npm install

      - name: Generate GraphQL types
        run: npm run codegen

      - name: Compile TypeScript
        run: npm run build

      - name: Run linters
        run: npm run lint

